name: Native who reference probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Observe default and GNU providers with fixed and live PIDs
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/who-reference
        run: python3 scripts/probe-who-reference.py
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache: false
      - name: Verify native who differential against identified GNU reference
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: go1.27.2
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
        run: go test -v ./cmds/who -run '^TestWhoNativeLinuxDifferential$' -count=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: who-reference
          path: ${{ runner.temp }}/who-reference
          if-no-files-found: error
