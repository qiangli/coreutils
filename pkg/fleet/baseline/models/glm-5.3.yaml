name: glm-5.3
family: glm
version: "5.3"
band: 2
band_source: declared
# DECLARED, not measured — and the distinction is the whole point of adding this as a
# NEW model file rather than editing glm-5.2's.
#
# The band carries over from glm-5.2 as a PRIOR, because a successor in the same family
# is the best guess available and a missing band routes nothing. It is not evidence.
# glm-5.2's L2 was earned over three exams (see glm-5.2.yaml, which stays exactly as it
# is — that file is the record of what 5.2 did, and a version bump must not overwrite
# a measurement it did not repeat).
#
# TO PROMOTE OR DEMOTE THIS: run the ladder, then set band_source: measured with the
# evidence inline. Until then every surface renders it `L2~` — the tilde IS the claim
# that nobody has checked.
#
# The open question inherited from 5.2, and the one worth measuring FIRST: 5.2 could
# not converge. It hit the iteration cap in 3/3 exams and delivered no report, which is
# why it is L2 and why it is never seated as conductor or steward. Whether 5.3 fixed
# that is the difference between a coder and a lead, so measure convergence before
# quality.

display: GLM-5.3 (z.ai)
provider: openai-compat
kind: api          # AUTH: an API key (same zai key as 5.2)
billing: flat      # PAY: the same prepaid GLM Coding Plan seat. Free at the margin.
base_url: https://api.z.ai/api/coding/paas/v4
api_key_ref: zai
# SAME endpoint and SAME key as 5.2 — verified live, not assumed. The coding-plan path
# (/api/coding/paas/v4, NOT the general /api/paas/v4) still applies; a coding-plan key
# on the general endpoint is rejected in a way that reads like "the model is broken".
model: glm-5.3
quality: 0.86
cost_micro: 900
ids:
  ycode: glm-5.3

# LIVE-VERIFIED 2026-08-19 on this host, against the coding-plan endpoint:
#   GET  /models             -> glm-5.3 present (newest id; 4.5 … 5.2 still listed)
#   POST /chat/completions   -> 200, model=glm-5.3, finish_reason=stop, content "OK"
#
# ONE MEASURED PROPERTY THAT 5.2's FILE DOES NOT HAVE, and it is a trap:
# 5.3 SPENDS REASONING TOKENS. Asked to reply with the two characters "OK" it used 34
# completion tokens, 29 of them reasoning.
#
#   max_tokens: 8   -> 200 OK, finish_reason present, content ""      <- EMPTY, not an error
#   max_tokens: 256 -> 200 OK, finish_reason stop,    content "OK"
#
# A caller with a small max_tokens gets a SUCCESSFUL RESPONSE CARRYING NOTHING. That is
# the house failure shape (docs/absence-of-evidence.md): a success state reached by the
# absence of output. Any harness capping completion tokens tightly must budget for the
# reasoning tokens FIRST, and must treat empty content on a 200 as a failure rather than
# as an answer.
