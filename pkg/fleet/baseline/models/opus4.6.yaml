band_source: declared
# declared, NOT operator: this host has run it through no gate. It is banded L3
# by FAMILY POSITION — the claude ladder is haiku L1, sonnet L2, opus L3, fable
# L4, and 4.6 is a previous-generation opus, so L3 is the ladder's answer rather
# than a judgement about this model. A gated run moves it; a version number does
# not.
