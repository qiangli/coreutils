# Free/Pro/Ultra plans (antigravity.google/docs/models; Enterprise plans do not
# get them). Keyed under `ids` rather than a bare `model:` because this id is
# agy's spelling — if the same model later arrives through the claude tool it
# will carry a different one, and a bare field would have to be rewritten.
#
# Verified accepted on the wire 2026-08-02:
#   $ agy --model claude-opus-4-6-thinking -p "reply with exactly: OK"  -> OK
ids:
  agy: claude-opus-4-6-thinking
